server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: authentiq-backend

  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/authentiq_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

authentiq:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  crypto:
    curve: secp256r1
    algorithm: SHA256withECDSA
    key-id: AUTHENTIQ-KEY-001
    key-version: 1
  risk:
    max-normal-scans: 3
    high-scan-threshold: 8
    max-unique-devices: 2
    geo-velocity-kmh-limit: 800.0 # Anomaly if travel speed exceeds commercial flight speed
  cors:
    allowed-origins: "*"

logging:
  level:
    root: INFO
    com.authentiq: DEBUG
