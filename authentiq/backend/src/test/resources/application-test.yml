spring:
  application:
    name: authentiq-backend-test
  datasource:
    url: jdbc:h2:mem:authentiq_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

authentiq:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000
  crypto:
    curve: secp256r1
    algorithm: SHA256withECDSA
    key-id: AUTHENTIQ-TEST-KEY-001
    key-version: 1
  risk:
    max-normal-scans: 3
    high-scan-threshold: 8
    max-unique-devices: 2
    geo-velocity-kmh-limit: 800.0
  cors:
    allowed-origins: "*"
